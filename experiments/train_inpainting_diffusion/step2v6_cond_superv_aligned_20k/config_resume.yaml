device: cuda:0
exp_dir: /data/xzy/warpgan20260803/20260803/warpgan_orig/WarpGAN-main/experiments/train_inpainting_diffusion/step2v6_cond_superv_aligned_20k
checkpoint_path: ./experiments/train_inpainting_diffusion/step2v6_cond_superv_aligned_20k/checkpoints/iteration_0024999.pt
max_steps: 45000
paths:
  sd: ./pretrained_models/AI-ModelScope/stable-diffusion-v1-5
  brushnet: ./pretrained_models/brushnet
  wplus_stage_c: /data/xzy/warpgan20260803/20260803/experiments/_wplus_identity_pretrain/checkpoints/iteration_50000.pt
  dataset:
    train: ./data/FFHQ-EG3D_all_static_rebalanced
    test: ./data/celeba-hq_1000_static_rebalanced
    synth: ./data/SynthData100000_rebalanced
data:
  batch_size: 1
  workers: 4
  test_batch_size: 2
  test_workers: 2
  rebalanced: false
  add_LPFF: false
  synth:
    able: true
    zplus: false
    batch_size: ${data.batch_size}
gan:
  device: ${device}
  eg3d_type: plus_r
  encoder_type: goae
  psp:
    n_styles: 14
  goae:
    mlp_layer: 2
    cfg: ./configs/swinv2.yaml
  state_dict_key: psp_state_dict
  checkpoint_path: ./pretrained_models/inversion/gan_encoder.pt
warp:
  warp_ori_train: true
  warp_ori_val: true
  warp_pred: false
  hybrid: true
wplus:
  mode: frozen
  gate_value: 3.0
  init_from_stage_c: true
reference:
  use: true
  use_mirror: true
  gate_init: 0.5
  mirror_gate_lr: 0.0001
  lr: 5.0e-06
brushnet:
  init: pretrained
  lr: 1.0e-05
  use_8bit_adam: true
  gradient_checkpointing: true
losses:
  eps_weight: 1.0
  real_pass1:
    visible_weight: 1.0
    hole_weight: 0.1
    mirror_anchor: true
  pixel:
    max_timestep: 200
    x0_clip: 3.0
    resolution: 256
    l1_weight: 0
    resnet_pl_weight: 0
    id_weight: 0
    weights_path: ./pretrained_models/LaMa_perceptual_loss_models
  latent:
    weight: 0
  lpips:
    weight: 0
  adversarial:
    weight: 0
  feature_matching:
    weight: 0
log:
  image_interval: 500
  board_interval: 50
  val_interval: 1000
  save_interval: 2000
  use_wandb: false
smoke:
  check: false
  fix_timestep: null
